<!-- @dsCard group="Знак" height=220 subtitle="Тихий · проявленный · в строку" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Знак — превью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap">
</head>
<body class="ecp-root">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 220px">
  <div style="padding: 32px 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
    <a class="ecp-logo" href="#top" aria-label="Есть что показать — на главную">
      <span class="ecp-logo__rule"></span>
      <span class="ecp-logo__word">Есть<br>что<br>показать</span>
    </a>
    <div class="ecp-caption">Тихий мир</div>
  </div>
  <div data-theme="revealed" style="background: var(--bg); padding: 32px 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
    <a class="ecp-logo ecp-logo--revealed" href="#top" aria-label="Есть что показать — на главную">
      <span class="ecp-logo__rule"></span>
      <span class="ecp-logo__word">Есть<br>что<br>показать</span>
    </a>
    <div class="ecp-caption">После поворота</div>
  </div>
  <div style="padding: 32px 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; border-left: 1px solid var(--line)">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a class="ecp-logo ecp-logo--inline" href="#top" aria-label="Есть что показать — на главную">
        <span class="ecp-logo__rule"></span>
        <span class="ecp-logo__word">Есть<br>что<br>показать</span>
      </a>
      <div style="font-size: 12px; line-height: 16px; color: var(--ink-subtle)">Делаем видимым то, что у вас уже есть</div>
    </div>
    <div class="ecp-caption">В строку + слоган</div>
  </div>
</div>
</body>
</html>
