<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Кнопка — превью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap">
</head>
<body class="ecp-root">
<div style="width: 390px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
  <a class="ecp-btn ecp-btn--primary ecp-btn--block" href="#form">
    <span>Обсудить ваш бизнес</span>
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><line x1="0" y1="6" x2="16" y2="6"></line><polyline points="11,1 16,6 11,11"></polyline></svg>
  </a>
  <a class="ecp-btn ecp-btn--secondary ecp-btn--block" href="#cases">
    <span>Посмотреть кейсы</span>
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><line x1="0" y1="6" x2="16" y2="6"></line><polyline points="11,1 16,6 11,11"></polyline></svg>
  </a>
  <a class="ecp-btn ecp-btn--text" href="#case">
    <span>Как это было</span>
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><line x1="0" y1="6" x2="16" y2="6"></line><polyline points="11,1 16,6 11,11"></polyline></svg>
  </a>
  <button class="ecp-btn ecp-btn--primary ecp-btn--block" type="submit" disabled>
    <span>Отправить</span>
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><line x1="0" y1="6" x2="16" y2="6"></line><polyline points="11,1 16,6 11,11"></polyline></svg>

</html>
